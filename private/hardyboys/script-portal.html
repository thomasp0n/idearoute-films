<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>HARDY BOYS — Script Access | IdeaRoute Films</title>
<!--
  NOTE: For best privacy and reliability, host PDF.js files locally in the same folder as this HTML.
  Download the following from a pinned PDF.js release and place them here:
    - pdf.min.js
    - pdf.worker.min.js
  If you prefer to use the CDN, change the <script> src below back to the CDN URL and set
  pdfjsLib.GlobalWorkerOptions.workerSrc accordingly.
-->
<script src="./pdf.min.js"></script>
<style>
  :root{
    --ink:#0c0d10; --paper:#efe9df; --paper-dim:#c9c2b4; --accent:#b1451c;
    --line: rgba(239,233,223,0.14); --mono:'Courier Prime','Courier New',monospace; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; background:var(--ink); color:var(--paper); font-family:var(--mono); min-height:100vh;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  #gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center; }
  #gate .reel{ width:46px;height:46px;border:2px solid var(--accent);border-radius:50%; margin-bottom:22px; position:relative; }
  #gate .reel:before, #gate .reel:after{ content:''; position:absolute; width:8px;height:8px;background:var(--accent);border-radius:50%; }
  #gate .reel:before{ top:6px; left:6px; } #gate .reel:after{ bottom:6px; right:6px; }
  #gate h1{ font-family:var(--serif); font-weight:400; letter-spacing:0.04em; font-size:clamp(26px,5vw,40px); margin:0 0 6px; }
  #gate .sub{ color:var(--paper-dim); font-size:13px; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:32px; }
  #gate input{ width:260px; padding:12px 14px; border-radius:6px; border:1px solid #444; background:#17181c; color:var(--paper);
    font-size:14px; text-align:center; letter-spacing:0.08em; -webkit-user-select:text; user-select:text; }
  #gate button{ margin-top:14px; padding:12px 26px; background:var(--accent); color:#fff; border:none; border-radius:6px;
    font-size:13px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer; }
  #gate .err{ color:var(--accent); font-size:12px; margin-top:14px; min-height:16px; }
  #gate .hint{ color:var(--paper-dim); font-size:12px; margin-top:30px; max-width:360px; line-height:1.7; }

  #viewer{ display:none; min-height:100vh; flex-direction:column; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 28px; background:rgba(12,13,16,0.95);
    border-bottom:1px solid var(--line); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--paper-dim); z-index:40; }
  .topbar .title{ color:var(--paper); }
  .topbar .viewer-id{ color:var(--accent); }

  .stage{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:24px; overflow:auto; }
  #pdfCanvas{ box-shadow:0 30px 80px rgba(0,0,0,0.55); border-radius:4px; max-width:100%; height:auto; background:#fff; }

  .nav{ display:flex; align-items:center; justify-content:center; gap:22px; padding:18px 0 30px; z-index:10; }
  .nav button{ background:transparent; border:1px solid var(--line); color:var(--paper); width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:16px; }
  .nav button:hover{ border-color:var(--accent); color:var(--accent); }
  .nav .counter{ font-size:12px; letter-spacing:0.08em; color:var(--paper-dim); min-width:70px; text-align:center; }

  #watermark{ position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; display:none; }

  #shield{ position:fixed; inset:0; z-index:50; display:none; background:rgba(12,13,16,0.9); backdrop-filter: blur(26px);
    align-items:center; justify-content:center; text-align:center; padding:24px; }
  #shield p{ color:var(--paper-dim); font-size:13px; letter-spacing:0.06em; text-transform:uppercase; max-width:340px; line-height:1.8; }
  body.blurred #viewer{ filter: blur(24px); }

  ::selection{ background:transparent; }
  @media print{ html, body { display:none !important; } }
</style>
</head>
<body>

<div id="gate">
  <div class="reel"></div>
  <h1>HARDY BOYS</h1>
  <div class="sub">Script Access — IdeaRoute Films — For Consideration Only</div>
  <!-- Auth UI left in place for later, currently disabled for preview mode -->
  <div class="hint">Preview mode enabled — authentication temporarily disabled.</div>
</div>

<div id="watermark"></div>

<div id="shield"><p>Content hidden while window is not in focus.<br>Return to this tab to continue reading.</p></div>

<div id="viewer">
  <div class="topbar">
    <span class="title">HARDY BOYS <span style="color:var(--paper-dim)">/// Screenplay</span></span>
    <span class="viewer-id" id="viewerIdLabel"></span>
  </div>
  <div class="stage">
    <canvas id="pdfCanvas"></canvas>
  </div>
  <div class="nav">
    <button onclick="prevPage()" aria-label="Previous">&#8592;</button>
    <span class="counter" id="counter">1 / 1</span>
    <button onclick="nextPage()" aria-label="Next">&#8594;</button>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — edit this section for your rollout
   ===================================================================== */

// 1. Path to your script PDF, uploaded next to this HTML file in the
//    same unlisted folder (never link this folder from your site nav).
const PDF_PATH = "hardyboys-script.pdf";

// 2. Per-producer credentials. Add entries here for each recipient.
//    SECURITY: DO NOT store plaintext passwords here. Store only SHA-256 hex of each password.
//    Example format (add one line per recipient):
//      "janedoe": { name: "Jane Doe", email: "jane@xyzstudios.com", passwordHash: "<SHA256_HEX>" }
//    Compute a SHA-256 hex in a browser console like:
//      crypto.subtle.digest('SHA-256', new TextEncoder().encode('theirpassword'))
//        .then(b => console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
//    After adding real entries, remove any demo/test accounts before distributing links.
const PRODUCERS = {
  // Add your recipients here. Example:
  // "janedoe": { name: "Jane Doe", email: "jane@xyzstudios.com", passwordHash: "<SHA256_HEX>" }
};

/* ===================================================================== */

// Use a locally-hosted worker for better privacy/control. Place pdf.worker.min.js in the same folder as this HTML.
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

// For preview mode we skip the per-producer id/password gate and open the viewer directly.
// This is temporary — restore the auth checks before production/real distribution.

let watermarkText = 'CONFIDENTIAL';

async function buildWatermark(){
  let ip = 'IP unavailable';
  try{
    const res = await fetch('https://api.ipify.org?format=json');
    if(res.ok){
      const data = await res.json();
      ip = data.ip || ip;
    }
  }catch(e){ /* offline or blocked — watermark still shows name/email/time */ }

  watermarkText = 'Preview User · Preview@example.com   ·  IP ' + ip + '  ·  ' + new Date().toISOString().slice(0,16).replace('T',' ') + '  ·  CONFIDENTIAL';
}

function burnWatermark(ctx, canvas, text){
  try{
    const w = canvas.width, h = canvas.height;
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#b1451c';
    ctx.translate(w/2, h/2);
    ctx.rotate(-0.45);
    const fontSize = Math.max(12, Math.floor(w / 28));
    ctx.font = `${fontSize}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const stepX = fontSize * 7;
    const stepY = fontSize * 6;
    for(let y = -h; y < h; y += stepY){
      for(let x = -w; x < w; x += stepX){
        ctx.fillText(text, x, y);
      }
    }
    ctx.restore();
  }catch(e){ console.warn('burnWatermark failed', e); }
}

/* ---------- PDF.js canvas rendering (no selectable text layer) ---------- */
let pdfDoc = null, currentPage = 1, totalPages = 1;
const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
const counter = document.getElementById('counter');

async function loadPdf(){
  try{
    pdfDoc = await pdfjsLib.getDocument(PDF_PATH).promise;
    totalPages = pdfDoc.numPages;
    renderPage(currentPage);
  }catch(err){
    document.querySelector('.stage').innerHTML =
      '<p style="color:#b1451c;">Could not load script PDF. Check that "' + PDF_PATH + '" is uploaded in this same folder.</p>';
  }
}

async function renderPage(num){
  try{
    const page = await pdfDoc.getPage(num);
    const containerWidth = Math.min(window.innerWidth * 0.85, 900);
    const unscaled = page.getViewport({ scale: 1 });
    const scale = containerWidth / unscaled.width;
    const viewport = page.getViewport({ scale });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const renderTask = page.render({ canvasContext: ctx, viewport: viewport });
    await renderTask.promise;
    burnWatermark(ctx, canvas, watermarkText);
    counter.textContent = num + ' / ' + totalPages;
  }catch(e){ console.error('renderPage error', e); }
}

function nextPage(){ if(currentPage < totalPages){ currentPage++; renderPage(currentPage); } }
function prevPage(){ if(currentPage > 1){ currentPage--; renderPage(currentPage); } }

/* ---------- Protections ---------- */
function attachProtections(){
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());

  document.addEventListener('keydown', function(e){
    const k = e.key ? e.key.toLowerCase() : '';
    if(k === 'arrowright') nextPage();
    if(k === 'arrowleft') prevPage();
    const blockedCombo = (e.ctrlKey || e.metaKey) && ['s','p','c','u'].includes(k);
    const devtoolsKey = k === 'f12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].includes(k));
    if(blockedCombo || devtoolsKey) e.preventDefault();
    if(k === 'printscreen') showShield(1200);
  });

  window.addEventListener('blur', () => showShield());
  window.addEventListener('focus', () => { if(document.visibilityState === 'visible') hideShield(); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') showShield(); });

  let devtoolsWarned = false;
  setInterval(function(){
    const threshold = 160;
    const widthGap = window.outerWidth - window.innerWidth > threshold;
    const heightGap = window.outerHeight - window.innerHeight > threshold;
    if((widthGap || heightGap) && !devtoolsWarned){ devtoolsWarned = true; showShield(); }
  }, 1000);

  function showShield(autoHideMs){
    document.body.classList.add('blurred');
    document.getElementById('shield').style.display = 'flex';
    if(autoHideMs) setTimeout(hideShield, autoHideMs);
  }
  function hideShield(){
    document.body.classList.remove('blurred');
    document.getElementById('shield').style.display = 'none';
  }
}

// Auto-open viewer for preview mode (no auth). Restore auth checks before public distribution.
(async function previewOpen(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('viewer').style.display = 'flex';
  document.getElementById('viewerIdLabel').textContent = 'Preview Mode — No Authentication';
  await buildWatermark();
  attachProtections();
  loadPdf();
})();
</script>
</body>
</html>
